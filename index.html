<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>门店选择 · B 方案改造</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <svg class="svg-definitions" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 2a8 8 0 0 0-8 8c0 6 8 12 8 12s8-6 8-12a8 8 0 0 0-8-8Z" fill="currentColor"/><circle cx="12" cy="10" r="2.7" fill="white"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 8a8 8 0 1 0 0 8M20 3v5h-5"/></symbol>
      <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 5h16l-6 7v6l-4 2v-8Z"/></symbol>
      <symbol id="i-app" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h5M8 17h3"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-8 9 8v11H3Z"/><path d="M9 21v-7h6v7"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24"><path d="M12 3v9h9A9 9 0 1 1 12 3Z"/><path d="M16 2v6h6a7 7 0 0 0-6-6Z"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0Z"/></symbol>
      <symbol id="i-empty" viewBox="0 0 96 96"><circle cx="48" cy="48" r="38" fill="#f4f5f8" stroke="none"/><rect x="24" y="25" width="42" height="49" rx="7" fill="#fff" stroke="#d8dce5" stroke-width="2"/><path d="M34 38h22M34 47h16" stroke="#d8dce5" stroke-width="3" stroke-linecap="round"/><circle cx="63" cy="62" r="10" fill="#fff" stroke="#bfc7d4" stroke-width="3"/><path d="m70 70 9 9" stroke="#bfc7d4" stroke-width="4" stroke-linecap="round"/></symbol>
    </defs>
  </svg>

  <main class="phone" aria-label="门店选择交互原型">
    <div class="status-bar" aria-hidden="true">
      <span class="status-time">09:39</span>
      <div class="status-right"><span class="signal"><i></i><i></i><i></i><i></i></span><svg viewBox="0 0 20 16"><path d="M2 5a12 12 0 0 1 16 0M5 8a8 8 0 0 1 10 0M8 11a3 3 0 0 1 4 0"/><circle cx="10" cy="14" r="1" fill="currentColor" stroke="none"/></svg><span class="battery"><span></span></span></div>
    </div>

    <section id="home-page" class="page home-page" aria-label="首页">
      <header class="home-header"><div class="mini-nav"><span></span><div class="mini-capsule" aria-hidden="true"><span>•••</span><b></b><i></i></div></div>
        <div class="home-store-row"><button id="open-stores" class="home-store" aria-label="选择门店"><svg class="icon pin"><use href="#i-pin"/></svg><span id="home-store-name"></span><span class="down-arrow" aria-hidden="true"></span></button><span class="user-name">张林<span class="tiny-arrow"></span></span><button class="edition" type="button" data-toast="当前为新版首页">新版 ⇄</button></div>
      </header>
      <div class="home-content">
        <img class="campaign-banner" src="./assets/首页活动横幅.jpg" alt="年货节 订货指引">
        <div class="announcement"><strong>公告</strong><span>0725测试通知数据标题3000+</span><svg class="icon"><use href="#i-chevron"/></svg></div>
        <h2 class="home-section-title">我的应用</h2>
        <div id="app-grid" class="app-grid"></div>
        <div class="new-products-header"><div><button class="product-tab active" type="button">近期上新</button><button class="product-tab" type="button" data-toast="暂无下架商品">近期下架</button></div><svg class="icon"><use href="#i-chevron"/></svg></div>
        <div class="product-card"><img src="./assets/商品缩略图.jpg" alt="新品商品"><div class="product-info"><h3><em>新品</em>中粮特殊版本联调测试350ml</h3><p>新品周期: 2026-10-20 至 2026-11-20</p><p>规格: 350ml | 200542</p><div class="product-bottom"><span><b>¥1.6</b> /瓶</span><button type="button" data-toast="请先确认当前门店">去订货</button></div></div></div>
        <div class="product-card second-product"><img src="./assets/商品缩略图.jpg" alt="新品商品"><div class="product-info"><h3><em>新品</em>李波涛测试勿用-1014100g</h3><p>新品周期: 2026-10-20 至 2026-11-20</p><p>规格: 100g | 101410</p><div class="product-bottom"><span><b>¥11.0</b> /瓶</span><button type="button" data-toast="请先确认当前门店">去订货</button></div></div></div>
      </div>
      <nav class="home-bottom-nav" aria-label="首页导航"><button class="active" type="button"><svg class="icon"><use href="#i-home"/></svg><span>首页</span></button><button type="button" data-toast="请从我的应用选择入口"><svg class="icon"><use href="#i-grid"/></svg><span>全部应用</span></button><button type="button" data-toast="本页为门店切换交互"><svg class="icon"><use href="#i-chart"/></svg><span>数据分析</span></button><button type="button" data-toast="张林 · 门店账号"><svg class="icon"><use href="#i-user"/></svg><span>我的账户</span></button></nav>
    </section>

    <section id="store-page" class="page store-page" aria-label="选择门店" hidden>
      <header class="store-nav"><button id="back-home" class="icon-button back-button" type="button" aria-label="返回首页，不提交本次选择"><svg class="icon"><use href="#i-back"/></svg></button><h1>选择门店</h1><div class="mini-capsule" aria-hidden="true"><span>•••</span><b></b><i></i></div></header>
      <div class="current-store-display" aria-label="当前选择的门店"><svg class="icon pin"><use href="#i-pin"/></svg><span id="current-store-name" aria-live="polite"></span></div>
      <div class="search-area"><div class="search-field"><svg class="icon"><use href="#i-search"/></svg><input id="store-search" type="search" placeholder="请输入门店名称" autocomplete="off" aria-label="搜索门店名称"><button id="clear-search" type="button" class="clear-search" aria-label="清空搜索" hidden><svg class="icon"><use href="#i-close"/></svg></button></div></div>
      <div class="store-toolbar"><div class="store-tabs" role="tablist" aria-label="门店列表类型"><button id="tab-nearby" class="store-tab active" role="tab" aria-selected="true" aria-controls="store-list" type="button" data-tab="nearby">附近&amp;常用</button><button id="tab-all" class="store-tab" role="tab" aria-selected="false" aria-controls="store-list" type="button" data-tab="all">全部</button></div><button id="refresh-location" class="refresh-location" type="button"><svg class="icon location-icon"><use href="#i-pin"/></svg><span>刷新定位</span></button></div>
      <div id="region-bar" class="region-bar" hidden><div id="breadcrumbs" class="breadcrumbs" aria-label="当前浏览区域"></div><button id="region-filter" class="region-filter" type="button" aria-label="选择省市区域"><svg class="icon"><use href="#i-filter"/></svg><span>筛选</span></button></div>
      <div id="store-list" class="store-list" role="tabpanel" aria-label="附近与常用门店"></div>
      <footer class="store-footer"><button id="confirm-store" class="confirm-store" type="button">确定</button></footer>
    </section>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <div class="home-indicator" aria-hidden="true"></div>
    <div id="region-sheet" class="region-sheet" hidden><button class="sheet-mask" type="button" aria-label="关闭区域筛选"></button><section class="sheet-panel" role="dialog" aria-modal="true" aria-label="区域筛选"><header><span>选择区域</span><button id="close-region-sheet" class="icon-button" type="button" aria-label="关闭区域筛选"><svg class="icon"><use href="#i-close"/></svg></button></header><div id="region-shortcuts" class="region-shortcuts"></div><button id="reset-region" type="button" class="reset-region">查看全部区域</button></section></div>
  </main>
  <script src="./app.js"></script>
</body>
</html>
